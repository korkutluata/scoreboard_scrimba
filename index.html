<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <button onclick="resetAll()">RESET</button>
    <div class="container">
        <div class="column">
            <h3>HOME</h3>
            <h2 class="score" id="home-score">0</h2>
            <div>
                <button onclick="homeAdd1()">+1</button>
                <button onclick="homeAdd2()">+2</button>
                <button onclick="homeAdd3()">+3</button>
            </div>
            <div>
                <button onclick="homeMinus1()">-1</button>
                <button onclick="homeMinus2()">-2</button>
                <button onclick="homeMinus3()">-3</button>
            </div>
        </div>
        <div class="column">
            <h3>AWAY</h3>
            <h2 class="score" id="guest-score">0</h2>
            <div>
                <button onclick="guestAdd1()">+1</button>
                <button onclick="guestAdd2()">+2</button>
                <button onclick="guestAdd3()">+3</button>
            </div>
            <div>
                <button onclick="guestMinus1()">-1</button>
                <button onclick="guestMinus2()">-2</button>
                <button onclick="guestMinus3()">-3</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
